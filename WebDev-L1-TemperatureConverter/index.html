<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body>
    <form>
        <h1>Temperature Converter</h1>

        
        <label for="textBox">Enter Temperature:</label>
        <input type="number" id="textBox" value="0">
        
        
        <p id="error" style="color: red; display: none;"></p>
        <br><br>

        
        <p>Select input unit:</p>

        <input type="radio" id="celsius" name="unit" value="celsius" checked>
        <label for="celsius">Celsius (°C)</label>
        <br><br>

        <input type="radio" id="fahrenheit" name="unit" value="fahrenheit">
        <label for="fahrenheit">Fahrenheit (°F)</label>
        <br><br>

        <input type="radio" id="kelvin" name="unit" value="kelvin">
        <label for="kelvin">Kelvin (K)</label>
        <br><br>

        
        <button type="button" onclick="convert()">Convert</button>
        <br><br>

        
        <div id="result">
            <p>Celsius: <span id="celsiusResult">—</span></p>
            <p>Fahrenheit: <span id="fahrenheitResult">—</span></p>
            <p>Kelvin: <span id="kelvinResult">—</span></p>
        </div>
    </form>

    <script src="script.js"></script>
</body>
</html>
